name: CI — BC5CDR Clinical NER System

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas==2.1.4 numpy==1.26.4 scikit-learn==1.3.2
          pip install sklearn-crfsuite seqeval joblib
          pip install pytest pytest-cov

      - name: Create required directories
        run: |
          mkdir -p ner_models logs data docs/plots

      - name: Run unit tests
        run: |
          pytest tests/test_pipeline_core.py -v --cov=src --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage
