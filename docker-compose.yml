version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: bc5cdr_ner_api
    ports:
      - "8000:8000"
    volumes:
      - ./ner_models:/app/ner_models
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: bc5cdr_ner_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./ner_models:/app/ner_models
      - ./logs:/app/logs
    environment:
      - NER_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
